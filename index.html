<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Работни часове</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --paper:#e5e8e2;
  --sheet:#fbfbf7;
  --ink:#151f1a;
  --ink-2:#3b4841;
  --muted:#67726b;
  --rule:#c8cec5;
  --ok:#11803d;
  --no:#c4372a;
  --safety:#f2b705;
  --hatch:repeating-linear-gradient(-45deg,rgba(242,183,5,.30) 0 6px,transparent 6px 12px);
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0b100e;
    --sheet:#141b17;
    --ink:#e8eee9;
    --ink-2:#b7c2ba;
    --muted:#8c998f;
    --rule:#2a3530;
    --ok:#43c674;
    --no:#f07461;
  }
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:15px/1.4 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:env(safe-area-inset-top,0px);background:var(--sheet);z-index:10}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--safety);outline-offset:2px}

.wrap{max-width:600px;margin:0 auto;padding:0 14px 48px}

/* login */
.login{max-width:420px;margin:9vh auto 0;padding:0 14px 80px}
.login h1{font:700 46px/1 var(--cond);margin:0 0 10px;letter-spacing:-.005em}
.login > p{margin:0 0 26px;color:var(--muted)}
.acc{display:grid;gap:12px}
.acc button{display:flex;align-items:stretch;width:100%;height:78px;padding:0 16px 0 0;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;overflow:hidden;cursor:pointer;text-align:left}
.acc button:hover{border-color:var(--ink)}
.badge{flex:0 0 78px;display:grid;place-items:center;background:var(--safety);color:#1a1400;font:700 40px/1 var(--cond)}
.nm{display:flex;flex-direction:column;justify-content:center;margin-left:16px;min-width:0}
.nm b{font:600 26px/1.05 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#loginMsg{min-height:1.4em;margin-top:16px;font-size:14px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:2px solid var(--ink);margin:0 -14px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.who{font:700 28px/1 var(--cond)}
.role-tag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--safety);color:#1a1400;font:700 11px/1.2 var(--sans);vertical-align:middle;text-transform:uppercase;letter-spacing:.04em}
.meta{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:baseline;margin-top:6px;font-size:13px}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.sync{color:var(--muted);font-size:12px}
.rate{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--muted)}
.prefs{display:flex;gap:16px;align-items:flex-end}
.rate select{width:100px;height:36px;text-align:right;font:600 22px/1 var(--cond);font-variant-numeric:tabular-nums;border:0;border-bottom:2px solid var(--ink);background:transparent;border-radius:0;padding:0 2px}
.rate select:focus{outline:none;border-bottom-color:var(--safety)}
.rate select:disabled{opacity:.65;cursor:not-allowed;border-bottom-style:dotted}

/* month */
.monthbar{display:flex;align-items:center;gap:12px;margin:22px 0 14px}
.monthbar h2{margin:0;flex:1;font:700 42px/1 var(--cond);letter-spacing:-.005em}
.monthbar button{width:46px;height:46px;padding:0;display:grid;place-items:center;background:transparent;border:2px solid var(--ink);border-radius:4px;font:600 28px/1 var(--cond);cursor:pointer}
.monthbar button:hover:not(:disabled){background:var(--ink);color:var(--sheet)}
.monthbar button:disabled{opacity:.3;cursor:default}

.stamp{display:grid;grid-template-columns:1fr 1fr;background:var(--sheet);border:1px solid var(--rule);border-left:10px solid var(--safety);border-radius:4px;margin-bottom:16px}
.stamp > div{padding:12px 14px}
.stamp > div + div{border-left:1px solid var(--rule)}
.stamp span{display:block;color:var(--muted);font-size:13px}
.stamp b{display:block;font:700 34px/1.05 var(--cond);font-variant-numeric:tabular-nums}

.legend{display:grid;gap:4px;font-size:13px;color:var(--ink-2);margin:0 2px 18px}
.legend b{display:inline-block;min-width:74px;font-weight:600;color:var(--ink)}

/* weeks */
.week{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;margin-bottom:14px;overflow:hidden}
.wk-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--ink);color:var(--sheet);font:600 17px/1.2 var(--cond)}
.wk-ctl{display:flex;flex-wrap:wrap;gap:10px 18px;padding:10px 12px;border-top:1px solid var(--rule);background:var(--paper)}
.wk-field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.wk-field select{width:118px;height:34px;min-width:0;padding:0 4px;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;font-size:14px}
.day{display:grid;grid-template-columns:38px 52px minmax(0,1.2fr) minmax(0,.8fr) 64px;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--rule)}
.day.we{background:rgba(21,31,26,.035)}
.dname{font:600 17px/1 var(--cond);white-space:nowrap}
.dname span{font-weight:500;color:var(--muted);margin-left:2px}
.mark{width:38px;height:38px;padding:0;display:grid;place-items:center;background:transparent;border:2px solid var(--rule);border-radius:4px;cursor:pointer;font:700 22px/1 var(--cond)}
.mark.yes{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.mark.no{border-color:var(--no);color:var(--no)}
.day select,.day input{width:100%;height:36px;min-width:0;padding:0 2px;background:transparent;border:0;border-bottom:1px solid var(--rule);border-radius:0;font-size:15px}
.day select:focus,.day input:focus{outline:none;border-bottom:2px solid var(--ink)}
.day input{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

.adv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid var(--rule);font-size:14px}
.adv.on{background:var(--hatch)}
.adv label{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.adv.on label{font-weight:700}
.adv input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--ink)}
.adv input[type=number]{width:130px;height:36px;padding:0 2px;background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;text-align:right;font:600 18px/1 var(--cond);font-variant-numeric:tabular-nums}
.adv input[type=number]:focus{outline:none;border-bottom:2px solid var(--ink)}

.wk-total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 12px;border-top:2px solid var(--ink);background:var(--paper)}
.wk-total .lbl{font:600 16px/1 var(--cond);color:var(--ink-2)}
.wk-total .v{font:700 22px/1 var(--cond);font-variant-numeric:tabular-nums;text-align:right}

/* month summary */
.summary{display:grid;gap:14px;margin-top:28px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:0 14px 6px}
.card h3{margin:0;padding:12px 0 10px;font:700 24px/1 var(--cond);border-bottom:2px solid var(--ink)}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px;color:var(--ink-2)}
.stat b{font:600 21px/1 var(--cond);color:var(--ink);font-variant-numeric:tabular-nums}
.stat.big{margin:8px -14px 6px;padding:12px 14px;border:0;background:var(--safety);color:#1a1400;font-size:15px;font-weight:600}
.stat.big b{font:700 32px/1 var(--cond);color:#1a1400}
.chip{display:inline-block;margin:4px 6px 10px 0;padding:4px 9px;border:1.5px solid var(--no);border-radius:3px;color:var(--no);font:600 16px/1 var(--cond)}
.muted{color:var(--muted);font-size:14px}
.card .muted{display:block;padding:6px 0 12px}
.rent{margin-top:4px}
.rent + .rent{margin-top:14px}
.rent-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--rule);font-size:14px;color:var(--ink-2);cursor:pointer}
.rent input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--ink)}
.rent input[type=number]{width:150px;height:36px;padding:0 2px;background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;text-align:right;font:600 20px/1 var(--cond);font-variant-numeric:tabular-nums}
.rent input[type=number]:focus{outline:none;border-bottom:2px solid var(--ink)}
.btn{height:38px;padding:0 12px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;font:600 14px/1 var(--sans);cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--safety);border-color:#d49e00;color:#1a1400;font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-4px 0 16px}
.xsel{height:38px;padding:0 8px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;font:600 14px var(--sans)}
.ytab{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;margin-bottom:16px}
.ytab table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ytab th,.ytab td{padding:9px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
.ytab th{font:600 12px var(--sans);color:var(--muted);text-transform:uppercase;background:var(--paper)}
.ytab th:first-child,.ytab td:first-child{text-align:left}
.ytab tbody tr{cursor:pointer}
.ytab tbody tr:hover td{background:var(--paper)}
.ytab tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.ytab td.b{font-weight:700}
#printArea{display:none}
@media print{
  body::before{display:none}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#000;background:#fff;font:12px Arial,sans-serif}
  #printArea h2{font-size:17px;margin:0 0 10px}
  #printArea table{width:100%;border-collapse:collapse;margin-bottom:12px}
  #printArea th,#printArea td{border:1px solid #777;padding:4px 6px;text-align:left}
  #printArea th{background:#e8e8e8}
  #printArea tfoot td{font-weight:700}
}
.acc .newacc{height:64px;justify-content:center;border:1px dashed var(--ink-2);background:transparent;font:600 18px/1 var(--cond);color:var(--ink)}
.acc .newacc:hover{background:var(--paper)}
.fl{width:26px;height:18px;border:1px solid var(--rule);border-radius:2px;vertical-align:middle;display:inline-block;flex:0 0 auto}
.czf{display:inline-block;margin-left:10px;vertical-align:middle}
.czf .fl{width:40px;height:28px;margin:0}
.flags{display:inline-flex;gap:4px;align-items:center;margin-top:6px}
.abackdrop{position:fixed;inset:0;background:rgba(10,15,12,.6);z-index:20;display:grid;place-items:center;padding:12px;overflow-y:auto}
.amodal{width:100%;max-width:420px;background:var(--sheet);border:2px solid var(--ink);border-radius:6px;padding:18px 16px;margin:auto}
.amodal h3{margin:0 0 6px;font:700 26px/1.1 var(--cond)}
.amodal p{margin:0 0 10px;font-size:14px;color:var(--ink-2)}
.fl-lbl{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.03em}
.fl-inp{width:100%;height:42px;padding:0 10px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;font-size:16px}
.fl-inp:disabled{opacity:.65;cursor:not-allowed}
.flagpick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fpick{display:flex;align-items:center;gap:8px;height:42px;padding:0 8px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;cursor:pointer;font:500 14px var(--sans);color:var(--ink)}
.fpick.on{border:2px solid var(--ink);background:var(--safety);color:#1a1400}
.fpick:disabled{opacity:.65;cursor:not-allowed}
.amodal .mfoot{display:flex;gap:8px;margin-top:16px}
.amodal .mfoot .btn{flex:1;justify-content:center;height:44px}
.btn.danger{color:var(--no);border-color:var(--no)}
.err-txt{color:var(--no);font-size:13px;font-weight:600;margin-top:8px;min-height:1.2em}
.hint-txt{color:var(--muted);font-size:12px;margin-top:4px}
/* визия: по-меки ъгли, сенки, плавни ефекти */
:root{--shadow:0 1px 2px rgba(20,30,25,.06),0 10px 26px rgba(20,30,25,.08);--r:16px}
body{background:radial-gradient(900px 500px at 50% -180px,rgba(255,255,255,.05),transparent 70%),var(--paper)}
.top{backdrop-filter:saturate(1.3) blur(12px);-webkit-backdrop-filter:saturate(1.3) blur(12px);box-shadow:0 6px 20px rgba(20,30,25,.08)}
.who{font-size:32px}
.stamp{border-radius:var(--r);box-shadow:var(--shadow);border-left-width:8px}
.stamp b{font-size:38px}
.week,.card,.ytab{border-radius:var(--r);box-shadow:var(--shadow);border-color:transparent}
.wk-head{background:linear-gradient(90deg,var(--ink),var(--ink-2));padding:11px 16px;letter-spacing:.01em}
.day{padding:10px 16px}
.day:hover{background:rgba(127,127,127,.05)}
.mark{border-radius:12px;transition:transform .15s ease,box-shadow .15s ease}
.mark:hover{transform:scale(1.06)}
.mark.yes{box-shadow:0 6px 14px rgba(17,128,61,.28)}
.wk-field select,.xsel,.fl-inp{border-radius:10px}
.btn{border-radius:999px;padding:0 18px;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(20,30,25,.12)}
.btn.primary{box-shadow:0 6px 16px rgba(242,183,5,.38)}
.monthbar button{border-radius:14px;box-shadow:var(--shadow);transition:transform .15s ease,background .15s ease}
.monthbar button:hover:not(:disabled){transform:translateY(-1px)}
.monthbar h2{letter-spacing:-.01em}
.acc button{border-radius:var(--r);box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.acc button:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(20,30,25,.14)}
.acc .newacc{border-radius:var(--r);box-shadow:none}
.nm b{font-size:28px}
.card h3{font-size:26px}
.stat.big{border-radius:14px}
.chip{border-radius:999px;padding:5px 11px}
.fpick{border-radius:999px}
.fpick.on{box-shadow:0 6px 14px rgba(242,183,5,.35)}
.amodal{border-radius:22px;border:none;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.abackdrop{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.ytab tbody tr:nth-child(even) td{background:rgba(127,127,127,.04)}
.ytab tbody tr:hover td{background:rgba(127,127,127,.09)}
.flags .fl{width:30px;height:20px;border-radius:3px}
/* цветове */
body:has(#login:not([hidden])){background:linear-gradient(160deg,#fde68a 0%,#fbcfe8 45%,#bfdbfe 100%)}
.login h1{background:linear-gradient(90deg,#1d4ed8,#db2777 55%,#d97706);-webkit-background-clip:text;background-clip:text;color:transparent}
.login > p{color:var(--ink-2)}
.acc button{background:rgba(255,255,255,.85)}
.acc > button:nth-child(4n+1) .badge{background:#2563eb;color:#fff}
.acc > button:nth-child(4n+2) .badge{background:#059669;color:#fff}
.acc > button:nth-child(4n+3) .badge{background:#db2777;color:#fff}
.acc > button:nth-child(4n+4) .badge{background:#7c3aed;color:#fff}
.acc .newacc{background:rgba(255,255,255,.5);border-color:#7c3aed;color:#5b21b6}
.who{color:var(--acc,var(--ink))}
.top{border-bottom:3px solid var(--acc,var(--ink))}
.monthbar h2{color:var(--acc,var(--ink))}
.monthbar button{border-color:var(--acc,var(--ink));color:var(--acc,var(--ink))}
.monthbar button:hover:not(:disabled){background:var(--acc,var(--ink));color:#fff;border-color:var(--acc,var(--ink))}
.stamp{border-left-color:var(--acc,var(--safety))}
.stamp b{color:var(--acc,var(--ink))}
.wk-head{background:linear-gradient(90deg,var(--acc,var(--ink)),var(--ink-2));color:#fff}
.wk-total{border-top-color:var(--acc,var(--ink))}
.wk-total .v{color:var(--acc,var(--ink))}
.btn.primary{background:var(--acc,var(--safety));color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.stat.big{background:var(--acc,var(--safety));color:#fff}
.stat.big b{color:#fff}
.ytab th{color:var(--acc,var(--muted))}
.card h3{color:var(--acc,var(--ink))}
.legend b{color:var(--acc,var(--ink))}
.day.today{border-left-color:var(--acc,var(--safety))}
.day{grid-template-columns:38px 52px minmax(0,1.1fr) minmax(0,.8fr) 60px 78px}
.day .dex{width:100%;height:36px;min-width:0;padding:0 4px;background:transparent;border:0;border-bottom:1px dashed var(--acc,var(--safety));border-radius:0;text-align:right;font:600 15px var(--cond);font-variant-numeric:tabular-nums;color:var(--acc,var(--ink))}
.day .dex:focus{outline:none;border-bottom:2px solid var(--acc,var(--ink))}
.day .dex::placeholder{color:var(--muted);font-weight:500}
.firm{display:inline-block;font:600 17px var(--sans);color:var(--ink-2);margin-top:6px;padding-bottom:1px;border-bottom:1px dashed var(--muted);cursor:pointer}
.firm-sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.langs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.langs-top{margin:0 0 0 6px}
.lbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:600 13px var(--sans);cursor:pointer;box-shadow:var(--shadow)}
.lbtn .fl{width:24px;height:16px;margin:0;border-radius:2px}
.lbtn.on{border-color:var(--acc,var(--ink));box-shadow:0 0 0 2px var(--acc,var(--ink))}
.lsel{height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:600 13px var(--sans);cursor:pointer;box-shadow:var(--shadow)}
.credit{position:fixed;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:12px;line-height:1.5;color:var(--ink-2);text-align:right;background:var(--sheet);padding:7px 11px;border-radius:12px;box-shadow:var(--shadow);z-index:6}
.credit a{color:inherit}
.brand{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:4px}
.brand .mono{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--acc,var(--safety));color:#fff;font:700 14px/1 var(--cond);letter-spacing:.02em}
.wm{font:700 17px/1 var(--cond);color:var(--ink);letter-spacing:.01em}
.wm sup{font:600 9px var(--sans);vertical-align:super;margin-left:1px}
.cr{font-size:11px;color:var(--muted);letter-spacing:.05em}
@media (max-width:480px){
  .day{grid-template-columns:38px 52px minmax(0,1.2fr) minmax(0,.8fr) 64px}
  .day .dex{grid-column:3 / span 3}
}
@media (prefers-color-scheme:dark){
  body:has(#login:not([hidden])){background:linear-gradient(160deg,#1e293b,#3b0764 50%,#422006)}
  .acc button{background:rgba(20,27,23,.85)}
  .acc .newacc{background:rgba(20,27,23,.5)}
}
.acc button.editing .nm b::after{content:" ✎";color:var(--muted);font-size:18px}
</style>
</head>
<body>

<section id="login" class="login">
  <h1>Работни часове <span id="czFlag" class="czf"></span></h1>
